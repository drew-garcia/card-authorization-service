[project]
name = "card-authorization-service"
version = "0.1.0"
description = "A FastAPI and Postgres service that approves or declines card swipes in real time and stays correct under concurrent requests, retries and failures."
readme = "README.md"
authors = [
    { name = "Andrew Garcia", email = "git@drewgarcia.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.163.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlmodel>=0.0.50",
]

[project.scripts]
authz = "authz:main"
authz-hold-expiry = "authz.workers.hold_expiry:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-repeat>=0.9.4",
    "ruff>=0.17.5",
]

[tool.uv.build-backend]
# The distribution is named card-authorization-service, but the import package stays `authz`.
module-name = "authz"

[tool.fastapi]
# Lets `uv run fastapi dev` find the app without a path argument.
entrypoint = "authz.main:app"
