[project]
name = "card-authorization-service"
version = "0.1.0"
description = "A FastAPI and Postgres service that approves or declines card swipes in real time and stays correct under concurrent requests, retries and failures."
readme = "README.md"
authors = [
    { name = "Andrew Garcia", email = "git@drewgarcia.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.163.1",
]

[project.scripts]
authz = "authz:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv.build-backend]
# The distribution is named card-authorization-service, but the import package stays `authz`.
module-name = "authz"
