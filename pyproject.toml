[project]
name = "authz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrew Garcia", email = "git@drewgarcia.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.163.1",
]

[project.scripts]
authz = "authz:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
